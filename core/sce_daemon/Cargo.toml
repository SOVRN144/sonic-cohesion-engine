[package]
name = "sce_daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
sce_core = { path = "../sce_core" }
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
